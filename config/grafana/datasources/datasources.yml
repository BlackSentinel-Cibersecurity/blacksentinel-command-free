# ============================================================================
# BlackSentinel Command - Grafana Configuration
# Dashboard provisioning and data sources
# ============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: blacksentinel
    user: blacksentinel
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    editable: true

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "blacksentinel-*"
    editable: true

providers:
  - name: 'BlackSentinel Dashboards'
    orgId: 1
    folder: 'BlackSentinel'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
